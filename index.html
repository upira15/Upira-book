<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>UPIRA – A Tamil Love Story</title>

  <meta name="description"
        content="UPIRA – A Tamil romantic story about love, memories and emotions. Read the complete book online.">

  <meta name="keywords"
        content="UPIRA, Tamil novel, Tamil love story, Tamil book, romantic novel">

  <meta name="author"
        content="UPIRA">

  <link rel="canonical"
        href="https://upira15.github.io/Upira-book/">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: #faf7f2;
      color: #2b2220;
      line-height: 1.6;
    }

    header {
      text-align: center;
      padding: 35px 20px 25px;
      background: #fff;
    }

    header img {
      max-width: 220px;
      width: 80%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }

    h1 {
      margin: 20px 0 5px;
      font-size: 34px;
    }

    .subtitle {
      color: #777;
      font-size: 16px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: #fff;
      margin: 25px 0;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
      color: #8b2f3c;
    }

    .book-reader {
      width: 100%;
      height: 700px;
      border: none;
      border-radius: 12px;
      background: #eee;
    }

    .reaction-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

    .reaction {
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 30px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 15px;
      transition: 0.2s;
    }

    .reaction:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .reaction.active {
      background: #f8e1e5;
      border-color: #c76b7a;
    }

    .reaction:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .reaction span {
      font-weight: bold;
      margin-left: 4px;
    }

    .small {
      color: #777;
      font-size: 14px;
      margin-top: 10px;
    }

    form {
      margin-top: 20px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-family: inherit;
      font-size: 15px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .submit-btn {
      border: none;
      background: #8b2f3c;
      color: white;
      padding: 12px 22px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 15px;
    }

    .submit-btn:hover {
      background: #702431;
    }

    .note {
      border-bottom: 1px solid #eee;
      padding: 15px 0;
    }

    .note:last-child {
      border-bottom: none;
    }

    .note-name {
      font-weight: bold;
      color: #8b2f3c;
    }

    .note-date {
      color: #999;
      font-size: 12px;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #777;
      font-size: 14px;
    }

    @media (max-width: 600px) {

      h1 {
        font-size: 28px;
      }

      .container {
        padding: 12px;
      }

      .card {
        padding: 18px;
      }

      .book-reader {
        height: 550px;
      }

      .reaction {
        font-size: 14px;
        padding: 9px 12px;
      }

    }

  </style>
</head>

<body>

  <header>

    <img src="upira-cover.png"
         alt="UPIRA Tamil Book Cover">

    <h1>UPIRA</h1>

    <div class="subtitle">
      A Tamil Love Story
    </div>

  </header>


  <main class="container">


    <!-- BOOK -->

    <section class="card">

      <h2>📖 Read UPIRA</h2>

      <p>
        Read the complete book online.
      </p>

      <iframe
        class="book-reader"
        src="UPIRA_BOOK.pdf"
        title="UPIRA Book">
      </iframe>

    </section>


    <!-- READER INTERACTION -->

    <section class="card">

      <h2>❤️ Reader Interaction</h2>

      <p>
        What did you feel after reading UPIRA?
      </p>


      <!-- IMPORTANT STATUS AREA -->

      <div id="reactionStatus"
           class="small">
        Connecting reader reactions...
      </div>


      <!-- REACTION BUTTONS -->

      <div class="reaction-row">

        <button
          type="button"
          class="reaction"
          data-reaction="❤️ Loved it">

          ❤️ Loved it
          <span>0</span>

        </button>


        <button
          type="button"
          class="reaction"
          data-reaction="🥺 Emotional">

          🥺 Emotional
          <span>0</span>

        </button>


        <button
          type="button"
          class="reaction"
          data-reaction="💭 Made me think">

          💭 Made me think
          <span>0</span>

        </button>


        <button
          type="button"
          class="reaction"
          data-reaction="🌹 Beautiful">

          🌹 Beautiful
          <span>0</span>

        </button>

      </div>


      <!-- READER NOTE FORM -->

      <h3>💌 Leave a Note</h3>

      <form id="noteForm">

        <input
          type="text"
          id="readerName"
          placeholder="Your name"
          maxlength="100"
          required>


        <textarea
          id="readerMessage"
          placeholder="Write your thoughts about UPIRA..."
          maxlength="1000"
          required></textarea>


        <button
          type="submit"
          class="submit-btn">

          Send Note

        </button>

      </form>


      <div
        id="noteStatus"
        class="small">
      </div>


      <!-- READER NOTES -->

      <h3>💭 Reader Notes</h3>

      <div id="readerNotes">

        <div class="small">
          Loading reader notes...
        </div>

      </div>

    </section>


  </main>


  <footer>

    © 2026 UPIRA. All rights reserved.

  </footer>



  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    (function () {


      /* =====================================
         SUPABASE CONFIGURATION
      ===================================== */

      const SUPABASE_URL =
        'https://jnktgzjrcyxbdgpdedge.supabase.co';


      const SUPABASE_PUBLISHABLE_KEY =
        'sb_publishable_V3ms7HM9FgRVMSU5z1ef6g_yy-8zTaE';


      /* =====================================
         HTML ELEMENTS
      ===================================== */

      const status =
        document.getElementById('reactionStatus');


      const buttons =
        document.querySelectorAll('.reaction');


      const notesBox =
        document.getElementById('readerNotes');


      const form =
        document.getElementById('noteForm');


      const noteStatus =
        document.getElementById('noteStatus');


      const nameInput =
        document.getElementById('readerName');


      const messageInput =
        document.getElementById('readerMessage');


      /* =====================================
         CHECK SUPABASE LIBRARY
      ===================================== */

      if (!window.supabase) {

        status.textContent =
          'Unable to load reader interaction service.';

        return;

      }


      /* =====================================
         CREATE SUPABASE CLIENT
      ===================================== */

      const db =
        window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_PUBLISHABLE_KEY
        );


      /* =====================================
         LOAD REACTIONS
      ===================================== */

      async function loadReactions() {

        try {

          const { data, error } =
            await db
            .from('reader_reactions')
            .select('reaction');


          if (error) {

            throw error;

          }


          const counts = {};


          (data || []).forEach(function (row) {

            counts[row.reaction] =
              (counts[row.reaction] || 0) + 1;

          });


          buttons.forEach(function (button) {

            const count =
              counts[button.dataset.reaction] || 0;


            const span =
              button.querySelector('span');


            if (span) {

              span.textContent = count;

            }

          });


          status.textContent =
            '✓ Live reactions are connected.';


        } catch (error) {


          console.error(
            'Reaction loading error:',
            error
          );


          status.textContent =
            'Reactions unavailable right now.';

        }

      }


      /* =====================================
         SAVE REACTION
      ===================================== */

      buttons.forEach(function (button) {


        button.addEventListener(
          'click',
          async function () {


            button.disabled = true;


            status.textContent =
              'Saving your reaction...';


            try {


              const { error } =
                await db
                .from('reader_reactions')
                .insert({

                  reaction:
                    button.dataset.reaction

                });


              if (error) {

                throw error;

              }


              button.classList.add('active');


              status.textContent =
                '✓ Thank you! Your reaction was added.';


              await loadReactions();


            } catch (error) {


              console.error(
                'Reaction insert error:',
                error
              );


              status.textContent =
                'Could not save your reaction. Please try again.';


            } finally {


              button.disabled = false;

            }

          }
        );

      });



      /* =====================================
         LOAD READER NOTES
      ===================================== */

      async function loadNotes() {


        notesBox.innerHTML =
          '<div class="small">Loading reader notes...</div>';


        try {


          const { data, error } =
            await db
            .from('reader_notes')
            .select(
              'name,message,created_at'
            )
            .order(
              'created_at',
              {
                ascending: false
              }
            )
            .limit(20);


          if (error) {

            throw error;

          }


          notesBox.innerHTML = '';


          if (!data || data.length === 0) {


            notesBox.innerHTML =
              '<div class="small">Be the first to leave a note.</div>';


            return;

          }


          data.forEach(function (note) {


            const div =
              document.createElement('div');


            div.className = 'note';


            const name =
              document.createElement('div');


            name.className =
              'note-name';


            name.textContent =
              note.name || 'Anonymous';


            const message =
              document.createElement('div');


            message.textContent =
              note.message || '';


            const date =
              document.createElement('div');


            date.className =
              'note-date';


            if (note.created_at) {

              const d =
                new Date(note.created_at);


              date.textContent =
                d.toLocaleString();

            }


            div.appendChild(name);

            div.appendChild(message);

            div.appendChild(date);


            notesBox.appendChild(div);

          });


        } catch (error) {


          console.error(
            'Reader notes error:',
            error
          );


          notesBox.innerHTML =
            '<div class="small">Unable to load reader notes.</div>';

        }

      }



      /* =====================================
         SAVE READER NOTE
      ===================================== */

      form.addEventListener(
        'submit',
        async function (event) {


          event.preventDefault();


          const name =
            nameInput.value.trim();


          const message =
            messageInput.value.trim();


          if (!name || !message) {

            noteStatus.textContent =
              'Please enter your name and message.';

            return;

          }


          const submitButton =
            form.querySelector(
              'button[type="submit"]'
            );


          submitButton.disabled = true;


          noteStatus.textContent =
            'Sending your note...';


          try {


            const { error } =
              await db
              .from('reader_notes')
              .insert({

                name: name,

                message: message

              });


            if (error) {

              throw error;

            }


            noteStatus.textContent =
              '✓ Your note has been added.';


            form.reset();


            await loadNotes();


          } catch (error) {


            console.error(
              'Note insert error:',
              error
            );


            noteStatus.textContent =
              'Could not save your note. Please try again.';


          } finally {


            submitButton.disabled = false;

          }

        }
      );



      /* =====================================
         START
      ===================================== */

      loadReactions();

      loadNotes();


    })();

  </script>


</body>
</html>
